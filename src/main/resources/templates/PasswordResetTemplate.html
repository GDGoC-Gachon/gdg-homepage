<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>GDGoC 비밀번호 변경</title>
</head>
<body style="font-family: Arial, sans-serif; background:#f0f2f5; display:flex; justify-content:center; align-items:center; height:100vh; margin:0;">

<div style="background:#fff; padding:40px; border-radius:12px; box-shadow:0 8px 20px rgba(0,0,0,0.15); text-align:center; max-width:400px; width:90%;">
    <h1 style="color:#4285F4; margin-bottom:10px;">Google Developer Groups on Campus Gachon University</h1>
    <h2 style="color:#4CAF50; margin-bottom:20px;">비밀번호 변경</h2>
    <p style="margin-bottom:30px;">
        비밀번호를 변경하려면 아래 버튼을 클릭해주세요.<br>
        버튼 클릭 후 새 비밀번호를 설정할 수 있습니다.
    </p>
    <a href="${resetLink}" style="text-decoration:none;">
        <div style="font-size:18px; font-weight:bold; background:#4CAF50; color:#fff; padding:15px 25px; display:inline-block; border-radius:10px; box-shadow:0 4px 10px rgba(0,0,0,0.1); margin-bottom:30px;">
            비밀번호 변경하기
        </div>
    </a>
    <p style="margin-bottom:15px;">본 메일은 법령에 따른 통지 및 고지 의무사항으로 수신 동의 여부와 상관없이 발송됩니다.</p>
    <p style="color:#666; font-size:12px;">Google Developer Groups of Gachon</p>

    <img src="/static/gdg.png" alt="GDG Logo" style="margin-top:20px; width:100px; height:auto;">

</div>

</body>
</html>
