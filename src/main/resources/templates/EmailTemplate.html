<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>GDGoC 이메일 인증 코드</title>
</head>
<body style="font-family: Arial, sans-serif; background:#f0f2f5; display:flex; justify-content:center; align-items:center; height:100vh; margin:0;">

<div style="background:#fff; padding:40px; border-radius:12px; box-shadow:0 8px 20px rgba(0,0,0,0.15); text-align:center; max-width:400px; width:90%;">
    <h1 style="color:#4285F4; margin-bottom:10px;">GDGoC Gachon University</h1>
    <h2 style="color:#4CAF50; margin-bottom:20px;">이메일 인증 코드</h2>
    <p style="margin-bottom:30px;">
        GDGoC 회원가입을 위한 인증 코드입니다.<br>
        아래의 코드를 입력하여 이메일 인증을 완료하세요.
    </p>
    <div style="font-size:28px; font-weight:bold; background:#f4f4f4; padding:15px 25px; display:inline-block; border-radius:10px; box-shadow:0 4px 10px rgba(0,0,0,0.1); margin-bottom:30px;">
        ${code}
    </div>
    <p style="margin-bottom:15px;">GDGoC와 함께 성장하는 개발자가 되어보세요!</p>
    <p style="color:#666; font-size:12px;">Google Developer Groups of Gachon</p>

    <!-- 이미지 추가 -->
    <img src="/static/gdg.png" alt="GDG Logo" style="margin-top:20px; width:100px; height:auto;">
</div>

</body>
</html>
